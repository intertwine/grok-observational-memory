[project]
name = "grok-observational-memory-dev"
version = "0.9.0"
description = "Development/test harness for the grok-observational-memory Grok Build plugin. Not published."
requires-python = ">=3.11"
license = "MIT"

[dependency-groups]
dev = ["pytest"]

[tool.uv]
# This repo ships shell scripts + JSON manifests, not a Python package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
